<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanban</title>
<style>
  :root {
    --bg: #f4f5f7;
    --board-bg: #f4f5f7;
    --col-bg: #ebecf0;
    --col-header: #44546f;
    --card-bg: #ffffff;
    --card-shadow: 0 1px 2px rgba(9, 30, 66, 0.25);
    --card-shadow-hover: 0 4px 10px rgba(9, 30, 66, 0.2);
    --text: #172b4d;
    --text-muted: #6b778c;
    --accent: #0052cc;
    --danger: #de350b;
    --border: #dfe1e6;
    --low: #36b37e;
    --medium: #ffab00;
    --high: #de350b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d2125;
      --board-bg: #1d2125;
      --col-bg: #282e33;
      --col-header: #b6c2cf;
      --card-bg: #22272b;
      --card-shadow: 0 1px 2px rgba(0,0,0,0.4);
      --card-shadow-hover: 0 4px 10px rgba(0,0,0,0.45);
      --text: #b6c2cf;
      --text-muted: #8c9bab;
      --accent: #579dff;
      --danger: #f87168;
      --border: #3c4148;
      --low: #4bce97;
      --medium: #f5cd47;
      --high: #f87168;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  header .sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .header-actions { display: flex; gap: 8px; }

  button {
    font-family: inherit;
    cursor: pointer;
  }
  .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 4px;
    font-size: 13px;
  }
  .btn:hover { background: var(--col-bg); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { filter: brightness(1.08); }

  .app-body {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .sidebar {
    width: 180px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    padding: 14px 8px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: 6px;
    background: none;
    border: none;
    color: var(--text);
    font-size: 13px;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: var(--col-bg); }
  .nav-item.active { background: var(--col-bg); font-weight: 600; }
  .nav-icon { font-size: 14px; }
  .nav-badge {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-muted);
    background: rgba(120,120,120,0.18);
    padding: 1px 7px;
    border-radius: 10px;
  }

  .content {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  #board-view {
    display: flex;
    gap: 12px;
    padding: 16px 20px;
    overflow-x: auto;
    overflow-y: hidden;
    align-items: flex-start;
    flex: 1;
    background: var(--board-bg);
  }
  #board-view.hidden { display: none; }

  #backlog-view {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  #backlog-view.hidden { display: none; }
  .backlog-header h2 { margin: 0 0 2px; font-size: 16px; }
  .backlog-header .sub { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .backlog-list { max-width: 640px; }
  .backlog-empty { color: var(--text-muted); font-size: 13px; padding: 10px 0 20px; }

  .column {
    background: var(--col-bg);
    border-radius: 8px;
    width: 272px;
    min-width: 272px;
    display: flex;
    flex-direction: column;
    max-height: 100%;
  }

  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 10px 6px 12px;
  }
  .column-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--col-header);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    padding: 2px 4px;
    border-radius: 3px;
  }
  .column-title:hover, .column-title:focus { background: rgba(9,30,66,0.06); }
  .count {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: 6px;
  }
  .col-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 15px;
    padding: 2px 6px;
    border-radius: 3px;
  }
  .col-delete:hover { background: rgba(9,30,66,0.08); color: var(--danger); }

  .task-list {
    flex: 1;
    overflow-y: auto;
    padding: 2px 8px;
    min-height: 20px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 6px;
    box-shadow: var(--card-shadow);
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: grab;
    position: relative;
    border-left: 3px solid transparent;
  }
  .card:hover { box-shadow: var(--card-shadow-hover); }
  .card.dragging { opacity: 0.4; }
  .card.priority-low { border-left-color: var(--low); }
  .card.priority-medium { border-left-color: var(--medium); }
  .card.priority-high { border-left-color: var(--high); }

  .card-title {
    font-size: 14px;
    line-height: 1.3;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .card-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .card-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    display: none;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    padding: 2px 5px;
    border-radius: 3px;
  }
  .card:hover .card-remove { display: block; }
  .card-remove:hover { background: rgba(9,30,66,0.08); color: var(--danger); }

  .backlog-card { padding-right: 26px; }
  .backlog-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 8px;
  }
  .to-todo-btn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--accent);
    color: #fff;
    border: none;
  }
  .to-todo-btn:hover { filter: brightness(1.08); }

  .drop-placeholder {
    height: 44px;
    border: 2px dashed var(--accent);
    border-radius: 6px;
    margin-bottom: 8px;
    opacity: 0.5;
  }

  .add-task-btn {
    display: block;
    width: calc(100% - 16px);
    margin: 4px 8px 10px;
    text-align: left;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    padding: 6px 8px;
    border-radius: 4px;
  }
  .add-task-btn:hover { background: rgba(9,30,66,0.08); color: var(--text); }
  #backlog-add-btn { width: auto; margin: 0 0 14px; padding: 6px 10px; border: 1px dashed var(--border); }

  .add-form {
    margin: 4px 8px 10px;
    background: var(--card-bg);
    border-radius: 6px;
    padding: 8px;
    box-shadow: var(--card-shadow);
  }
  #backlog-view .add-form { margin: 0 0 14px; max-width: 640px; }
  .add-form textarea, .add-form input[type="text"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    resize: vertical;
    margin-bottom: 6px;
  }
  .add-form select {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 6px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    margin-bottom: 8px;
  }
  .add-form .row { display: flex; gap: 8px; align-items: center; }
  .form-actions { display: flex; gap: 8px; }

  .new-column {
    width: 272px;
    min-width: 272px;
  }
  .new-column-btn {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px dashed var(--border);
    color: var(--text-muted);
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    text-align: left;
  }
  .new-column-btn:hover { background: var(--col-bg); color: var(--text); }

  #import-input { display: none; }
  .live-badge {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }
</style>
</head>
