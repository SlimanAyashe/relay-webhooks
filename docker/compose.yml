name: relay

x-logging: &default-logging
  # json-file has no size cap by default -- stdout is the only place structlog's
  # JSON lines go (see docs/adr/0007-phase-5-observability-and-ops.md), so without
  # this every container's log would grow unbounded on disk. Rotates at 10MB x 5
  # files per container (50MB cap), which is Docker-level and needs no host cron/
  # logrotate setup -- see docs/runbook.md.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  relay-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "relay.workers.relay"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    read_only: true
    tmpfs:
      - /tmp
    # The image's baked-in HEALTHCHECK curls /healthz, which only the api service serves --
    # workers don't listen on any port, so disable it rather than have Docker report them
    # perpetually unhealthy.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  dispatcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "relay.workers.dispatcher"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    ports:
      # The dispatcher's own Prometheus exporter (relay.infra.metrics) -- see
      # docs/adr/0007-phase-5-observability-and-ops.md. curl localhost:9100/metrics locally.
      - "9100:9100"
    read_only: true
    tmpfs:
      - /tmp
    # The image's baked-in HEALTHCHECK curls /healthz, which only the api service serves --
    # workers don't listen on any port, so disable it rather than have Docker report them
    # perpetually unhealthy. (The dispatcher's own :9100 is a Prometheus exporter, not a
    # liveness endpoint, so it doesn't change that.)
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  # S3-compatible object storage standing in for real AWS S3 in local dev, so
  # scripts/backup_postgres.py and scripts/restore_drill.py can be exercised end to end
  # without an AWS account -- point BACKUP_S3_ENDPOINT_URL at it (see .env.example). Not
  # started by `make up`; bring it up on demand with
  # `docker compose -f docker/compose.yml --profile backup-drill up -d minio`.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Loopback-only: MinIO here runs with well-known default credentials, and this
      # compose file is also what the backup drill uses on the real (public) VPS -- see
      # docs/runbook.md. Publishing it on 0.0.0.0 would put an open object store with
      # `minioadmin:minioadmin` on the internet.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["backup-drill"]
    logging: *default-logging

  scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "relay.workers.scheduler"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    read_only: true
    tmpfs:
      - /tmp
    # The image's baked-in HEALTHCHECK curls /healthz, which only the api service serves --
    # workers don't listen on any port, so disable it rather than have Docker report them
    # perpetually unhealthy.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  reaper:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "relay.workers.reaper"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:relay@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    read_only: true
    tmpfs:
      - /tmp
    # The image's baked-in HEALTHCHECK curls /healthz, which only the api service serves --
    # workers don't listen on any port, so disable it rather than have Docker report them
    # perpetually unhealthy.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    logging: *default-logging

volumes:
  pgdata:
