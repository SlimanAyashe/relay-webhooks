[project]
name = "relay"
version = "0.1.0"
description = "Webhook delivery service — at-least-once delivery via a transactional outbox and Redis Streams"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "freezegun>=1.5",
    "testcontainers[postgres,redis]>=4.8",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "polyfactory>=3.3.0",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "ASYNC", # flake8-async
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["relay"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `Depends(...)` as an argument
# default; B008 exists to catch accidental function calls in defaults
# elsewhere, so exempt the framework's own DI helpers.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["relay"]
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"

[tool.importlinter]
root_packages = ["relay"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "relay.api | relay.workers",
    "relay.services",
    "relay.repositories",
    "relay.infra",
]

[[tool.importlinter.contracts]]
name = "Domain has zero internal dependencies"
type = "forbidden"
source_modules = ["relay.domain"]
forbidden_modules = ["relay.api", "relay.workers", "relay.services", "relay.repositories", "relay.infra"]
