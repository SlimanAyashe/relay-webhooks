name: relay

# Production overlay: api runs the pre-built GHCR image (set via $RELAY_IMAGE
# by scripts/deploy_remote.sh). TLS termination and routing are handled by
# the host's shared Traefik instance (see docs/adr/0002-shared-vps-traefik.md)
# via labels below, not by a Relay-owned proxy — this VPS also runs other
# production services (bookr.tech, n8n) whose Traefik already owns 80/443.
# Bring up with: RELAY_IMAGE=ghcr.io/<owner>/<repo>:<sha> docker compose -f
# docker/compose.prod.yml up -d
#
# Expects a .env file one directory up (../.env relative to this file, i.e.
# /opt/relay/.env on the VPS — never committed) providing POSTGRES_PASSWORD.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: ${RELAY_IMAGE:?RELAY_IMAGE must be set to a ghcr.io image ref}
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000" # loopback-only, for deploy_remote.sh's own /readyz poll
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.relay.rule: Host(`relay.bookr.tech`) || Host(`api.relay.bookr.tech`)
      traefik.http.routers.relay.entrypoints: websecure
      traefik.http.routers.relay.tls.certresolver: letsencrypt
      traefik.http.services.relay.loadbalancer.server.port: "8000"

volumes:
  pgdata:
