ntext so image builds stay small and fast.","priority":"medium","createdAt":6},"task-p0-07":{"id":"task-p0-07","title":"Bootstrap FastAPI app entrypoint","description":"src/relay/api exposes an ASGI app factory (create_app), runnable via uvicorn locally with an empty router \u2014 no business endpoints yet, just a booting app.","priority":"high","createdAt":7},"task-p0-08":{"id":"task-p0-08","title":"Add pydantic-settings config module","description":"src/relay/infra config module loads all runtime settings (DB URL, Redis URL, ports, log level) from env vars via pydantic-settings, with a typed Settings object injected into the app.","priority":"medium","createdAt":8},"task-p0-09":{"id":"task-p0-09","title":"Write .env.example with all variables documented","description":"Every env var consumed by Settings is listed with a comment explaining purpose and a safe example value; no real secrets present; referenced from README.","priority":"medium","createdAt":9},"task-p0-10":{"id":"task-p0-10","title":"Configure pytest + FastAPI TestClient fixtures","description":"pytest config plus conftest.py providing an app/TestClient fixture, so tests/unit and tests/integration can both import and exercise the app.","priority":"medium","createdAt":10},"task-p0-11":{"id":"task-p0-11","title":"Implement /healthz liveness endpoint","description":"GET /healthz returns 200 with no dependency checks (process-alive only); unit test asserts 200 and expected payload shape.","priority":"medium","createdAt":11},"task-p0-12":{"id":"task-p0-12","title":"Add SQLAlchemy async engine/session setup","description":"src/relay/infra defines an async engine/session factory built from Settings' DB URL, with a FastAPI dependency for a request-scoped session \u2014 no models yet.","priority":"medium","createdAt":12},"task-p0-13":{"id":"task-p0-13","title":"Wire Alembic migrations (env.py, initial revision)","description":"alembic init under migrations/, env.py reads DB URL from Settings (not hardcoded), and an initial empty revision runs `alembic upgrade head` successfully against local Postgres.","priority":"high","createdAt":13},"task-p0-14":{"id":"task-p0-14","title":"Provision test DB via Alembic, not create_all","description":"Integration test fixture spins up/points at a test database and applies schema exclusively via `alembic upgrade head`; confirm zero calls to Base.metadata.create_all anywhere in the repo.","priority":"high","createdAt":14},"task-p0-15":{"id":"task-p0-15","title":"Add Redis client wiring in infra layer","description":"src/relay/infra defines a Redis client/connection factory built from Settings' Redis URL, exposed as a FastAPI dependency \u2014 no stream logic yet, just connectivity.","priority":"medium","createdAt":15},"task-p0-16":{"id":"task-p0-16","title":"Implement /readyz checking Postgres + Redis","description":"GET /readyz performs a real query against Postgres and a real ping against Redis, returning 200 only if both succeed and 503 with a per-dependency breakdown otherwise; tests cover both healthy and simulated-failure cases.","priority":"medium","createdAt":16},"task-p0-17":{"id":"task-p0-17","title":"Write multi-stage Dockerfile (builder + runtime)","description":"Builder stage installs deps via uv into a venv/wheel; runtime stage is slim, copies only the built artifact, and dependency layers are ordered so code changes don't invalidate the dep cache.","priority":"high","createdAt":17},"task-p0-18":{"id":"task-p0-18","title":"Harden Dockerfile: non-root, read-only, pinned digest","description":"Runtime stage runs as a non-root user, sets a read-only root filesystem (with explicit writable tmpfs where needed), pins the base image by digest, and adds a HEALTHCHECK hitting /healthz.","priority":"medium","createdAt":18},"task-p0-19":{"id":"task-p0-19","title":"Build image locally, record size in README","description":"`docker build` succeeds, final image size is captured and added to README alongside the build command, giving a baseline to track regressions against.","priority":"low","createdAt":19},"task-p0-20":{"id":"task-p0-20","title":"Write docker-compose.yml (api, postgres, redis)","description":"Compose file brings up api + postgres + redis with named volumes for Postgres data, env vars sourced from .env, and api depends_on healthy postgres/redis.","priority":"high","createdAt":20},"task-p0-21":{"id":"task-p0-21","title":"Add Caddy service to compose for local proxying","description":"Caddy service added to compose with a local Caddyfile reverse-proxying to the api container over plain HTTP for local dev (no TLS requirement yet).","priority":"medium","createdAt":21},"task-p0-22":{"id":"task-p0-22","title":"Verify local stack boots, /readyz goes green","description":"`docker compose up` brings the full stack up from a clean state and curl against /readyz through Caddy returns 200, confirming api, Postgres, and Redis are correctly wired end to end.","priority":"high","createdAt":22},"task-p0-23":{"id":"task-p0-23","title":"Write Makefile for common dev commands","description":"Makefile exposes targets for lint, typecheck, test, up/down, migrate, and build so all dev workflows are one command; referenced from README as the canonical entrypoint.","priority":"medium","createdAt":23},"task-p0-24":{"id":"task-p0-24","title":"CI job: ruff + mypy on every PR","description":"GitHub Actions workflow triggered on PR runs ruff check, ruff format --check, and mypy src, failing the check on any violation.","priority":"high","createdAt":24},"task-p0-25":{"id":"task-p0-25","title":"CI job: pytest unit + integration suite","description":"CI job spins up Postgres/Redis service containers and runs pytest tests/unit tests/integration, failing the PR check on any test failure.","priority":"medium","createdAt":25},"task-p0-26":{"id":"task-p0-26","title":"CI job: Alembic upgrade/downgrade round-trip","description":"CI job runs alembic upgrade head, downgrade -1, upgrade head against a scratch Postgres service container on every PR, catching irreversible or broken migrations before merge.","priority":"high","createdAt":26},"task-p0-27":{"id":"task-p0-27","title":"CI job: import-linter architecture contracts","description":"import-linter config encodes the intended layering (api \u2192 services \u2192 domain/repositories \u2192 infra, no reverse imports) and runs as a required CI job.","priority":"medium","createdAt":27},"task-p0-28":{"id":"task-p0-28","title":"CI job: pip-audit dependency scan","description":"pip-audit runs against the locked dependency set on every PR and fails on high-severity known vulnerabilities.","priority":"medium","createdAt":28},"task-p0-29":{"id":"task-p0-29","title":"CI job: validate Docker image build","description":"CI job runs docker build on every PR (no push) to catch Dockerfile breakage before merge, independent of the GHCR publish step.","priority":"medium","createdAt":29},"task-p0-30":{"id":"task-p0-30","title":"Add pull request template","description":".github/PULL_REQUEST_TEMPLATE.md prompts for change summary, testing performed, and migration/rollback notes so every PR carries consistent context.","priority":"low","createdAt":30},"task-p0-31":{"id":"task-p0-31","title":"Enable branch protection requiring CI checks","description":"main branch protection configured to require lint/typecheck, test, migration round-trip, import-linter, pip-audit, and docker-build checks to pass plus at least one review before merge.\n\nBLOCKED: Needs a live GitHub repo (this repo isn't pushed anywhere yet) plus admin access to configure branch protection rules.","priority":"medium","createdAt":31},"task-p0-32":{"id":"task-p0-32","title":"CI: build + push image to GHCR on main","description":"On merge to main, a workflow builds the production image and pushes it to GHCR tagged with the commit SHA (and latest), reusing the Dockerfile validated in CI.","priority":"high","createdAt":32},"task-p0-33":{"id":"task-p0-33","title":"Provision VPS: Docker, firewall, DNS record","description":"Target VPS has Docker + Compose installed, firewall allows only 22/80/443, and the project domain's A record points at the VPS IP.\n\nBLOCKED: Needs an actual VPS (provider, IP/SSH access) and a registered domain name from the user; nothing to provision against yet.","priority":"high","createdAt":33},"task-p0-34":{"id":"task-p0-34","title":"Add GitHub Actions deploy secrets (SSH)","description":"Deploy SSH private key, host, and user stored as GitHub Actions repo secrets; a minimal test workflow confirms SSH connectivity from Actions to the VPS.\n\nBLOCKED: Needs a live GitHub repo to hold Actions secrets, plus the VPS SSH key from p0-33.","priority":"medium","createdAt":34},"task-p0-35":{"id":"task-p0-35","title":"Configure production Caddy for real domain TLS","description":"Production Caddyfile on the VPS reverse-proxies the real domain to the api container and lets Caddy provision/renew TLS automatically via ACME; verified with a manual docker compose up on the VPS.\n\nBLOCKED: Needs the real domain name (for the Caddyfile) and the live VPS from p0-33.","priority":"high","createdAt":35},"task-p0-36":{"id":"task-p0-36","title":"Add tag-triggered deploy workflow (SSH + migrate)","description":"Pushing a version tag triggers a workflow that SSHes into the VPS, pulls the SHA-tagged image from GHCR, runs alembic upgrade head against production, then docker compose up -d.","priority":"high","createdAt":36},"task-p0-37":{"id":"task-p0-37","title":"Add health-gated deploy swap with auto-rollback","description":"Deploy workflow polls /readyz after compose up; on success the swap is complete, on failure it aborts and leaves the previous container running untouched, with the workflow reporting failure clearly.","priority":"high","createdAt":37},"task-p0-38":{"id":"task-p0-38","title":"Ship first production deploy (day-5 milestone)","description":"Tag a release, run the full pipeline end to end, and confirm https://<domain>/readyz returns 200 over real TLS with no manual intervention \u2014 the \"skeleton in production\" milestone.\n\nBLOCKED: Needs everything above (repo, VPS, DNS, secrets) to actually be live before a first deploy can run.","priority":"high","createdAt":38},"task-p0-39":{"id":"task-p0-39","title":"Adopt conventional commits via pre-commit hook","description":"A commit-msg hook (e.g. commitlint or a pre-commit hook) enforces conventional commit format locally, matching the convention documented in README/CONTRIBUTING.","priority":"low","createdAt":39},"task-p0-40":{"id":"task-p0-40","title":"Write first ADR: Phase 0 stack + deploy decisions","description":"docs/adr/0001-phase-0-skeleton.md records the key choices (uv, Alembic-only migrations, Caddy for TLS, health-gated deploy) and the alternatives rejected, in the project's ADR format.","priority":"low","createdAt":40},"task-p0-41":{"id":"task-p0-41","title":"Finalize README: setup, env vars, image size","description":"README covers local setup (Makefile targets), full env var reference (linking .env.example), final Docker image size, and a one-paragraph architecture overview of the running stack.","priority":"low","createdAt":41},"task-p1-01":{"id":"task-p1-01","title":"Scaffold Phase 1 domain/services/repositories modules","description":"Add empty domain/services/repositories submodules for tenants, api_keys, endpoints, and events with docstrings pinning the api \u2192 services \u2192 repositories \u2192 infra layering (domain imports nothing) before any Phase 1 code lands.","priority":"high","createdAt":1},"task-p1-02":{"id":"task-p1-02","title":"Alembic migration: create tenants table","description":"Autogenerate and hand-review a migration creating the tenants table (id, name, created_at, deleted_at) with `alembic upgrade head` verified locally against Postgres.","priority":"high","createdAt":2},"task-p1-03":{"id":"task-p1-03","title":"Alembic migration: create api_keys table","description":"Autogenerate and hand-review a migration creating the api_keys table (tenant_id FK, key_hash, key_prefix, scopes, revoked_at, created_at) with an index on key_prefix for fast lookup without a full-table scan.","priority":"high","createdAt":3},"task-p1-04":{"id":"task-p1-04","title":"Alembic migration: create endpoints table","description":"Autogenerate and hand-review a migration creating the endpoints table (tenant_id FK, url, secret, subscribed_event_types, status, breaker_state, opened_at) per the plan's data model, hand-reviewed before merge.","priority":"high","createdAt":4},"task-p1-05":{"id":"task-p1-05","title":"Alembic migration: create events table with idempotency constraint","description":"Autogenerate and hand-review a migration creating the events table (tenant_id FK, type, payload JSONB, idempotency_key, created_at) with a `UNIQUE(tenant_id, idempotency_key)` constraint enforced at the DB level.","priority":"high","createdAt":5},"task-p1-06":{"id":"task-p1-06","title":"Define Phase 1 domain entities","description":"Define pure domain entities for Tenant, ApiKey, Endpoint, and Event as dataclasses/value objects with zero I/O and zero framework imports, expressing business rules (e.g. an ApiKey knows how to check its own scopes) independent of persistence or wire format.","priority":"high","createdAt":6},"task-p1-07":{"id":"task-p1-07","title":"Define Phase 1 ORM models","description":"Define SQLAlchemy 2.0 mapped classes for Tenant, ApiKey, Endpoint, and Event matching the Phase 1 migrations, kept in the repositories layer and never imported by the domain or api layers.","priority":"high","createdAt":7},"task-p1-08":{"id":"task-p1-08","title":"Define Phase 1 Pydantic wire schemas","description":"Define Pydantic request/response schemas for tenant, api-key, endpoint, and event payloads (create/update/read variants) in the api layer, mapped to/from domain entities at the boundary and never passed into services directly.","priority":"high","createdAt":8},"task-p1-09":{"id":"task-p1-09","title":"Implement TenantRepository and ApiKeyRepository","description":"Implement TenantRepository and ApiKeyRepository over the async SQLAlchemy session, exposing create/get/list/revoke operations that return domain entities (never ORM objects) and support prefix-based API key lookup.","priority":"high","createdAt":9},"task-p1-10":{"id":"task-p1-10","title":"Implement EndpointRepository with keyset pagination","description":"Implement EndpointRepository with create/get/update/delete/list operations returning domain entities, where list() accepts a cursor and limit and orders by a stable key for keyset pagination.","priority":"medium","createdAt":10},"task-p1-11":{"id":"task-p1-11","title":"Implement EventRepository with idempotency conflict detection","description":"Implement EventRepository with an insert operation that catches the `UNIQUE(tenant_id, idempotency_key)` DB violation and surfaces it as a typed domain conflict for the service layer to handle, rather than leaking a raw DB exception.","priority":"high","createdAt":11},"task-p1-12":{"id":"task-p1-12","title":"Implement unit-of-work for transaction boundaries","description":"Implement a unit-of-work context manager wrapping the async SQLAlchemy session and repositories, giving each service use case a single commit/rollback boundary instead of ad hoc session handling scattered across services.","priority":"high","createdAt":12},"task-p1-13":{"id":"task-p1-13","title":"Implement API key hashing, prefix, and verification","description":"Implement API key generation, salted hashing over the secret portion, prefix extraction, and constant-time verification as pure domain/infra logic, unit-tested against known vectors including tampered and truncated keys.","priority":"high","createdAt":13},"task-p1-14":{"id":"task-p1-14","title":"Implement API key issuance, rotation, and revocation service","description":"Implement an ApiKeyService use case for issuing a new key for a tenant, rotating a key (revoke + issue atomically via the unit-of-work), and revoking a key, returning the plaintext key exactly once at issuance time only.","priority":"medium","createdAt":14},"task-p1-15":{"id":"task-p1-15","title":"Implement auth dependency: key validation, scopes, tenant isolation","description":"Implement a FastAPI dependency that extracts the API key from the request header, verifies its hash and revocation status, loads the owning tenant, enforces required scopes, and scopes all downstream queries to that tenant \u2014 rejecting missing/malformed/revoked keys with 401 before any handler code runs.","priority":"high","createdAt":15},"task-p1-16":{"id":"task-p1-16","title":"Implement EndpointService use cases","description":"Implement an EndpointService with register/list/update/delete use cases (validating URL format and subscribed event types) operating purely on domain entities via the unit-of-work, with no FastAPI or SQLAlchemy imports.","priority":"medium","createdAt":16},"task-p1-17":{"id":"task-p1-17","title":"Implement /v1/endpoints CRUD router","description":"Implement the /v1/endpoints router (POST/GET/PATCH/DELETE) delegating entirely to EndpointService with no DB session or ORM import in the router module, converting between Pydantic schemas and domain entities at the boundary.","priority":"medium","createdAt":17},"task-p1-18":{"id":"task-p1-18","title":"Implement cursor pagination utility","description":"Implement an opaque, encoded cursor pagination helper (encode/decode keyset cursors) shared across list endpoints, replacing OFFSET-based paging, with unit tests covering forward paging and an invalid-cursor error case.","priority":"medium","createdAt":18},"task-p1-19":{"id":"task-p1-19","title":"Wire cursor pagination into GET /v1/endpoints","description":"Wire the cursor pagination helper into GET /v1/endpoints, returning `next_cursor`/`has_more` in the response envelope, covered by a test asserting stable ordering and no skipped/duplicated rows across pages.","priority":"medium","createdAt":19},"task-p1-20":{"id":"task-p1-20","title":"Implement EventIngestService idempotency-key handling","description":"Implement an EventIngestService use case that, given a tenant, event payload, and `Idempotency-Key`, returns the existing event unchanged if the key was seen before with an identical body, and raises a typed conflict if the key was seen before with a differing body.","priority":"high","createdAt":20},"task-p1-21":{"id":"task-p1-21","title":"Implement POST /v1/events ingest router","description":"Implement POST /v1/events delegating to EventIngestService, returning `202 Accepted` with a `Location` header pointing at the created event, and translating the idempotency conflict into the shared problem+json error envelope.","priority":"high","createdAt":21},"task-p1-22":{"id":"task-p1-22","title":"Implement RFC 9457 exception hierarchy and central handler","description":"Implement the internal exception hierarchy and a central FastAPI exception handler mapping all raised exceptions to RFC 9457 `application/problem+json` responses with `type`, `title`, `status`, `detail`, `instance`, and `trace_id` fields, never leaking a stack trace across the wire.","priority":"high","createdAt":22},"task-p1-23":{"id":"task-p1-23","title":"Normalize Pydantic 422s into the problem+json envelope","description":"Override FastAPI's default RequestValidationError handling so Pydantic 422s are normalized into the same problem+json envelope used by the rest of the API, with field-level errors under `detail` and no framework-default error shape leaking through.","priority":"medium","createdAt":23},"task-p1-24":{"id":"task-p1-24","title":"Add trace_id middleware for requests and errors","description":"Add middleware that generates (or propagates an inbound) trace/correlation ID per request, attaches it to structured logs for that request, and includes it in every problem+json error response so a user can quote it back.","priority":"medium","createdAt":24},"task-p1-27":{"id":"task-p1-27","title":"Extend import-linter contract for Phase 1 modules","description":"Extend the import-linter contract to cover the new tenants/api_keys/endpoints/events modules across api/services/domain/repositories, and verify a deliberately forbidden import (repositories importing from domain) fails the contract.","priority":"medium","createdAt":27},"task-p1-28":{"id":"task-p1-28","title":"Add testcontainers Postgres fixture for integration suite","description":"Add a testcontainers-managed real Postgres fixture for tests/integration (container-scoped, schema applied via `alembic upgrade head`, transactional rollback per test), reusing the Phase 0 Redis client wiring with no stream logic, and confirm no SQLite or mocked DB appears anywhere in the suite.","priority":"high","createdAt":28},"task-p1-32":{"id":"task-p1-32","title":"Integration test: revoked/malformed key and tenant isolation","description":"Add integration tests proving a revoked or malformed API key is rejected with `401`, and that a valid key belonging to tenant A cannot read or modify tenant B's endpoints or events, covering Testing scenario #12 against real Postgres.","priority":"high","createdAt":32},"task-p1-30":{"id":"task-p1-30","title":"Integration test: idempotency key dedup","description":"Add an integration test proving a duplicate POST /v1/events with the same `Idempotency-Key` and identical body returns the original event with no second row inserted, covering Testing scenario #5 against real Postgres.","priority":"high","createdAt":30},"task-p1-31":{"id":"task-p1-31","title":"Integration test: 409 on differing body for reused key","description":"Add an integration test proving POST /v1/events with a reused `Idempotency-Key` but a differing body returns `409` via the problem+json envelope, covering Testing scenario #6 against real Postgres.","priority":"high","createdAt":31},"task-p1-29":{"id":"task-p1-29","title":"Add polyfactory factories for Phase 1 entities","description":"Add polyfactory factories for Tenant, ApiKey, Endpoint, and Event domain entities so integration tests can generate realistic test data without hand-rolled fixtures.","priority":"medium","createdAt":29},"task-p1-25":{"id":"task-p1-25","title":"Add OpenAPI examples and auth scheme docs","description":"Add request/response examples and a documented API-key auth security scheme to every Phase 1 v1 endpoint's OpenAPI metadata, including the full set of problem+json error response shapes per endpoint.","priority":"medium","createdAt":25},"task-p1-26":{"id":"task-p1-26","title":"CI job: OpenAPI spec drift check","description":"Add a CI step that generates the OpenAPI spec from the running app, diffs it against a committed spec file under docs/, and fails the build on drift, with a Makefile target to regenerate the committed spec locally.","priority":"medium","createdAt":26},"task-p1-33":{"id":"task-p1-33","title":"Write ADR: Phase 1 API and domain decisions","description":"Write docs/adr/0002-phase-1-api-domain.md capturing the Phase 1 decisions (three-model-set layering, idempotency-key conflict semantics, cursor vs offset pagination, API key hashing scheme) with alternatives considered and the tradeoff accepted for each.","priority":"low","createdAt":33},"task-p1-34":{"id":"task-p1-34","title":"Update docs/failure-modes.md with Phase 1 rows","description":"Add Phase 1 rows to docs/failure-modes.md (duplicate idempotency key, differing-body idempotency conflict, revoked/malformed API key, cross-tenant access attempt), each naming the expected behavior and the test that proves it.","priority":"low","createdAt":34},"task-p2-01":{"id":"task-p2-01","title":"Alembic migration: create outbox table","description":"Autogenerate and hand-review a migration creating the outbox table (event_id FK, status, locked_at, attempts, created_at) written in the same transaction as the owning event, per the plan's data model.","priority":"high","createdAt":1},"task-p2-02":{"id":"task-p2-02","title":"Alembic migration: create deliveries table","description":"Autogenerate and hand-review a migration creating the deliveries table (event_id FK, endpoint_id FK, state, attempt_count, next_retry_at, created_at), one row per (event, subscribed endpoint) pair.","priority":"high","createdAt":2},"task-p2-03":{"id":"task-p2-03","title":"Alembic migration: create delivery_attempts table","description":"Autogenerate and hand-review a migration creating the delivery_attempts table (delivery_id FK, attempt_no, response_status, latency_ms, error_class, request/response snippets, created_at) as a plain append-only table, deliberately unpartitioned per the plan's scope discipline.","priority":"high","createdAt":3},"task-p2-04":{"id":"task-p2-04","title":"Define Phase 2 domain entities","description":"Define pure domain entities for OutboxEntry, Delivery, and DeliveryAttempt as dataclasses/value objects with zero I/O, expressing delivery state transitions (pending -> in-flight -> delivered/retrying/dead) independent of persistence or transport.","priority":"high","createdAt":4},"task-p2-05":{"id":"task-p2-05","title":"Define Phase 2 ORM models","description":"Define SQLAlchemy 2.0 mapped classes for Outbox, Delivery, and DeliveryAttempt matching the Phase 2 migrations, kept in the repositories layer and never imported by the domain or api layers.","priority":"high","createdAt":5},"task-p2-06":{"id":"task-p2-06","title":"Implement backoff-with-jitter calculator","description":"Implement a pure domain function computing `min(cap, base * 2^attempt)` with full jitter for retry scheduling, unit-tested for monotonic cap behavior and jitter bounds, with the rationale for full jitter (avoiding synchronized retry storms) captured in a docstring-adjacent comment or the eventual ADR.","priority":"high","createdAt":6},"task-p2-07":{"id":"task-p2-07","title":"Write the outbox row in the event's own transaction","description":"Extend EventIngestService's unit-of-work so the outbox row is inserted in the exact same transaction as the event row, so a `202` response is only ever returned after both are durably committed together.","priority":"high","createdAt":7},"task-p2-08":{"id":"task-p2-08","title":"Implement OutboxRepository with SKIP LOCKED claiming","description":"Implement OutboxRepository with a claim-due-rows operation using `SELECT ... FOR UPDATE SKIP LOCKED`, plus mark-processed/mark-failed operations, so concurrent relay instances never claim the same row.","priority":"high","createdAt":8},"task-p2-09":{"id":"task-p2-09","title":"Implement DeliveryRepository","description":"Implement DeliveryRepository with create (one row per subscribed endpoint), get, and update operations (state, attempt_count, next_retry_at) returning domain entities, never ORM objects.","priority":"high","createdAt":9},"task-p2-10":{"id":"task-p2-10","title":"Implement DeliveryAttemptRepository","description":"Implement DeliveryAttemptRepository exposing an append-only insert for attempt rows (response_status, latency_ms, error_class, request/response snippets), with no update or delete operation since the log is immutable.","priority":"medium","createdAt":10},"task-p2-11":{"id":"task-p2-11","title":"Implement Redis Streams infra wiring","description":"Extend the infra layer with stream-naming conventions, idempotent consumer-group creation (`XGROUP CREATE ... MKSTREAM`, tolerating `BUSYGROUP`), and thin `XADD`/`XREADGROUP`/`XACK` helpers used by the relay and dispatcher workers.","priority":"high","createdAt":11},"task-p2-12":{"id":"task-p2-12","title":"Implement Redis ZSET retry-schedule infra wiring","description":"Extend the infra layer with helpers to add a delivery to the retry ZSET scored by `next_retry_at` and to pop all entries whose score is now due, used by the retry path and the scheduler tick.","priority":"high","createdAt":12},"task-p2-13":{"id":"task-p2-13","title":"Implement outbound HTTP sender port and httpx adapter","description":"Define an outbound-HTTP-sender port (protocol) plus a real httpx-based adapter with explicit connect/read timeouts, and a fake adapter for tests, so DeliveryAttemptService never imports httpx directly.","priority":"high","createdAt":13},"task-p2-14":{"id":"task-p2-14","title":"Implement DeliveryAttemptService","description":"Implement a service that sends one delivery attempt via the HTTP sender port, classifies the outcome (2xx success / retryable failure / timeout), and writes the attempt row via DeliveryAttemptRepository, returning enough for the caller to decide the next state transition.","priority":"high","createdAt":14},"task-p2-15":{"id":"task-p2-15","title":"Implement the relay worker: claim, fan out, publish","description":"Implement the relay worker loop: claim due outbox rows via OutboxRepository, resolve each event's subscribed endpoints, create one Delivery row and `XADD` one stream message per endpoint, and mark the outbox row processed \u2014 all within a single unit of work so a crash mid-fan-out is safely retried, not partially applied.","priority":"high","createdAt":15},"task-p2-16":{"id":"task-p2-16","title":"Implement the dispatcher worker's consumer loop","description":"Implement the dispatcher worker: an `XREADGROUP` consumer-group loop that pulls delivery stream messages and invokes DeliveryAttemptService for each, acking only after the attempt is durably recorded.","priority":"high","createdAt":16},"task-p2-17":{"id":"task-p2-17","title":"Implement bounded async worker pool inside the dispatcher","description":"Bound the dispatcher's concurrency with an async worker pool (fixed task count reading from the same consumer group), so message intake exerts backpressure rather than spawning unbounded concurrent deliveries.","priority":"medium","createdAt":17},"task-p2-18":{"id":"task-p2-18","title":"Implement the retry-on-failure path","description":"On a retryable failure or timeout, compute `next_retry_at` via the backoff-with-jitter calculator, update the Delivery row's state and attempt_count, and push the delivery into the Redis retry ZSET instead of re-queuing immediately.","priority":"high","createdAt":18},"task-p2-19":{"id":"task-p2-19","title":"Implement the scheduler worker","description":"Implement the scheduler worker: a tick loop that pops due entries from the retry ZSET and `XADD`s each back onto the delivery stream, so retries flow through the same consumer-group path as fresh deliveries.","priority":"high","createdAt":19},"task-p2-20":{"id":"task-p2-20","title":"Implement the XAUTOCLAIM reaper worker","description":"Implement the reaper worker: periodically `XAUTOCLAIM`s pending entries idle past the visibility timeout (consumer died mid-delivery) and re-dispatches them, which is what makes the at-least-once guarantee real rather than aspirational.","priority":"high","createdAt":20},"task-p2-21":{"id":"task-p2-21","title":"Implement graceful SIGTERM drain for all workers","description":"Add SIGTERM handling to the relay, dispatcher, scheduler, and reaper workers: stop pulling new work, finish in-flight deliveries, then exit \u2014 so a deploy swap never truncates a delivery mid-flight.","priority":"medium","createdAt":21},"task-p2-22":{"id":"task-p2-22","title":"Add worker entrypoints and wire them into docker-compose","description":"Add `python -m relay.workers.{relay,dispatcher,scheduler,reaper}` entrypoints and corresponding services in `docker-compose.yml` so `make up` brings up the full delivery pipeline locally alongside the api, postgres, and redis containers already there.","priority":"medium","createdAt":22},"task-p2-23":{"id":"task-p2-23","title":"Extend import-linter contract for the workers module","description":"Extend the import-linter contract to place `relay.workers` correctly in the `api -> services -> repositories -> infra` layering (workers depend on services/repositories/infra, nothing depends on workers), and verify a deliberately forbidden import fails the contract.","priority":"medium","createdAt":23},"task-p2-24":{"id":"task-p2-24","title":"Add testcontainers Redis Streams fixture for the integration suite","description":"Extend the existing testcontainers Redis fixture with consumer-group setup/teardown (`XGROUP CREATE`/`XGROUP DESTROY`) scoped per test, so integration tests exercise real `XREADGROUP`/`XACK`/`XAUTOCLAIM` semantics rather than a mocked stream.","priority":"medium","createdAt":24},"task-p2-25":{"id":"task-p2-25","title":"Add polyfactory factories for Phase 2 entities","description":"Add polyfactory factories for OutboxEntry, Delivery, and DeliveryAttempt domain entities so integration tests can generate realistic delivery-pipeline data without hand-rolled fixtures.","priority":"medium","createdAt":25},"task-p2-26":{"id":"task-p2-26","title":"Integration test: crash before relay publish is recovered","description":"Add an integration test proving that if the process dies after the DB commit but before the relay publishes to the stream, the outbox row survives and a subsequent relay run picks it up \u2014 Testing scenario #1.","priority":"high","createdAt":26},"task-p2-27":{"id":"task-p2-27","title":"Integration test: SKIP LOCKED gives a row to exactly one relay","description":"Add an integration test running two relay claim operations concurrently against the same due outbox row and asserting `SKIP LOCKED` gives it to exactly one, with the other getting nothing \u2014 Testing scenario #2.","priority":"high","createdAt":27},"task-p2-28":{"id":"task-p2-28","title":"Chaos test: XAUTOCLAIM reclaims a message after a worker dies","description":"Add a chaos test that kills a dispatcher worker after `XREADGROUP` but before it acks, then asserts the reaper's `XAUTOCLAIM` reclaims the pending message and it is redelivered \u2014 Testing scenario #3.","priority":"high","createdAt":28},"task-p2-29":{"id":"task-p2-29","title":"Idempotency test: redelivery after a post-send crash produces a duplicate","description":"Add a test that kills a worker after the HTTP request is sent but before it acks, and asserts the receiver observes a duplicate delivery on redelivery \u2014 the test that proves exactly-once external effects are impossible by design, per Testing scenario #4.","priority":"high","createdAt":29},"task-p2-30":{"id":"task-p2-30","title":"Integration test: a 500 response schedules jittered backoff","description":"Add an integration test (using `respx` and `freezegun`) proving a downstream 500 response schedules a retry with a `next_retry_at` matching the backoff formula within its jitter bounds \u2014 Testing scenario #7.","priority":"high","createdAt":30},"task-p2-31":{"id":"task-p2-31","title":"Integration test: a timeout is recorded as a timeout, not a success","description":"Add an integration test proving a downstream connection that times out mid-response is recorded with `error_class=timeout` and never marked as a successful delivery \u2014 Testing scenario #8.","priority":"high","createdAt":31},"task-p2-32":{"id":"task-p2-32","title":"Integration test: a due retry moves from the ZSET back onto the stream","description":"Add an integration test proving that once a ZSET entry's `next_retry_at` is due, the scheduler tick pops it and `XADD`s it back onto the delivery stream exactly once \u2014 Testing scenario #9.","priority":"high","createdAt":32},"task-p2-33":{"id":"task-p2-33","title":"Write ADR: Phase 2 delivery engine decisions","description":"Write docs/adr/0004-phase-2-delivery-engine.md capturing the Phase 2 decisions (transactional outbox vs. publishing straight to Redis, Redis Streams consumer groups vs. Celery, full-jitter exponential backoff, at-least-once vs. attempted exactly-once) with alternatives considered and the tradeoff accepted for each.","priority":"low","createdAt":33},"task-p2-34":{"id":"task-p2-34","title":"Update docs/failure-modes.md with Phase 2 rows","description":"Add Phase 2 rows to docs/failure-modes.md (outbox survives a pre-publish crash, SKIP LOCKED race, XAUTOCLAIM reclaim, duplicate delivery after a post-send crash, jittered backoff on failure, timeout classification, ZSET-to-stream retry handoff), each naming the expected behavior and the test that proves it.","priority":"low","createdAt":34},"task-p3-01":{"id":"task-p3-01","title":"Add Phase 3 settings: HMAC tolerance, breaker thresholds, SSRF deny list, rate limits","description":"Extend the pydantic-settings config module with a signature replay-window tolerance, circuit breaker failure threshold and cooldown, the SSRF-guard denied-CIDR list and allowed ports, and per-tenant rate-limit budget, so Phase 3 behavior is tunable without code changes.","priority":"medium","createdAt":1},"task-p3-02":{"id":"task-p3-02","title":"Implement HMAC signing module","description":"Implement HMAC-SHA256 signing over `timestamp.body` using the endpoint's stored secret, in `relay.infra.signing`, pure and framework-agnostic so it can be unit tested without HTTP or DB fixtures.","priority":"high","createdAt":2},"task-p3-03":{"id":"task-p3-03","title":"Implement constant-time signature verification with replay window","description":"Implement verification using `hmac.compare_digest`, rejecting timestamps outside the configured tolerance window, in the same signing module as the signer so both sides of the contract stay in sync.","priority":"high","createdAt":3},"task-p3-04":{"id":"task-p3-04","title":"Wire signing headers into the outbound HTTP adapter","description":"Attach `X-Relay-Signature`, `X-Relay-Timestamp`, and `X-Relay-Delivery-Id` headers to every outbound delivery request in the httpx adapter, computed from the endpoint's secret and the exact request body being sent.","priority":"high","createdAt":4},"task-p3-05":{"id":"task-p3-05","title":"Implement SSRF guard: DNS resolution and CIDR deny list","description":"Implement `relay.infra.ssrf_guard` resolving a destination hostname and rejecting loopback, RFC1918, link-local, CGNAT, IPv6 ULA, and `169.254.169.254` addresses post-resolution, per the plan's SSRF design.","priority":"high","createdAt":5},"task-p3-06":{"id":"task-p3-06","title":"Enforce allowed-port allow-list in the SSRF guard","description":"Reject destination URLs targeting ports other than 80/443 in the SSRF guard, closing off the common port-scanning-via-webhook abuse pattern.","priority":"medium","createdAt":6},"task-p3-07":{"id":"task-p3-07","title":"Implement IP-pinned outbound transport","description":"Implement a custom httpx transport that connects to the already-validated IP address directly rather than re-resolving the hostname, preserving the original `Host` header and SNI, closing the DNS-rebinding TOCTOU window between validation and connection.","priority":"high","createdAt":7},"task-p3-08":{"id":"task-p3-08","title":"Disable automatic redirect following and re-validate on each hop","description":"Configure the outbound adapter to not follow redirects automatically; when a redirect response is encountered, re-run the SSRF guard against the `Location` target before making any further connection, per the plan's redirect-hop requirement.","priority":"high","createdAt":8},"task-p3-09":{"id":"task-p3-09","title":"Wire the SSRF guard into the outbound HTTP adapter as a pre-flight check","description":"Run the SSRF guard before every delivery attempt (not only the first), classifying a blocked destination as a distinct `ssrf_blocked` `AttemptErrorClass` recorded on the delivery attempt rather than silently dropped.","priority":"high","createdAt":9},"task-p3-11":{"id":"task-p3-11","title":"Implement circuit breaker domain logic","description":"Implement pure closed/open/half-open state-transition logic in the domain layer keyed off consecutive-failure count and cooldown elapsed, independent of persistence, matching the `breaker_state`/`opened_at` columns already present on `endpoints`.","priority":"high","createdAt":11},"task-p3-12":{"id":"task-p3-12","title":"Persist circuit breaker transitions via EndpointRepository","description":"Add repository methods to read and update an endpoint's `breaker_state` and `opened_at` atomically alongside delivery-attempt recording, so a state read by the dispatcher is never stale relative to the attempt that just completed.","priority":"high","createdAt":12},"task-p3-13":{"id":"task-p3-13","title":"Wire circuit breaker into the dispatcher's delivery path","description":"Have the dispatcher check breaker state before attempting delivery: skip and reschedule when open, allow a single probe attempt when half-open, and flip to open after the configured consecutive-failure threshold or back to closed on a half-open success.","priority":"high","createdAt":13},"task-p3-14":{"id":"task-p3-14","title":"Implement per-endpoint concurrency cap in the dispatcher","description":"Add a semaphore per endpoint inside the dispatcher's worker pool so one slow or dead destination cannot consume the entire worker pool, per the plan's explicit 80%-benefit-for-10%-effort scope call versus full fair scheduling.","priority":"medium","createdAt":14},"task-p3-15":{"id":"task-p3-15","title":"Implement retry-budget exhaustion transitioning a delivery to DEAD","description":"Extend the retry-on-failure path so that once a delivery's attempt count exceeds the configured budget, it transitions to `DeliveryState.DEAD` instead of continuing to back off indefinitely, making the DLQ real per Phase 2's deferred scope.","priority":"high","createdAt":15},"task-p3-16":{"id":"task-p3-16","title":"Implement DLQ query on DeliveryRepository","description":"Add a repository method listing deliveries with `state = 'dead'`, keyset-paginated consistent with the rest of the API, without introducing a separate DLQ table per the plan's data model.","priority":"medium","createdAt":16},"task-p3-17":{"id":"task-p3-17","title":"Implement GET /v1/dlq listing router","description":"Implement an authenticated, tenant-scoped router listing a tenant's dead deliveries with their attempt history, using the existing cursor pagination utility from Phase 1.","priority":"medium","createdAt":17},"task-p3-18":{"id":"task-p3-18","title":"Implement DLQ replay service and endpoint","description":"Implement `POST /v1/deliveries/{id}/replay` starting a fresh delivery chain for a dead delivery (reset state, re-publish to the stream) while preserving the original `delivery_attempts` history for audit, scoped so a tenant can only replay their own deliveries.","priority":"high","createdAt":18},"task-p3-19":{"id":"task-p3-19","title":"Implement Redis-backed per-tenant rate limiter","description":"Implement a token-bucket rate limiter in `relay.infra` keyed by tenant id, using Redis for shared state across API replicas, exposing a simple `allow(tenant_id) -> bool` interface to the service layer.","priority":"high","createdAt":19},"task-p3-20":{"id":"task-p3-20","title":"Wire rate limiting into POST /v1/events","description":"Enforce the per-tenant rate limiter on event ingest, returning `429` with a `Retry-After` header computed from the bucket's refill time, via the existing RFC 9457 problem+json envelope rather than a bespoke error shape.","priority":"high","createdAt":20},"task-p3-21":{"id":"task-p3-21","title":"Add a domain error and problem+json mapping for rate-limit and SSRF-block cases","description":"Extend the Phase 1 exception hierarchy with `RateLimitExceeded` and `SsrfBlocked` domain errors mapped to their respective HTTP responses by the existing central handler, keeping the one-hierarchy-one-handler design intact.","priority":"medium","createdAt":21},"task-p3-22":{"id":"task-p3-22","title":"Add respx fixtures for redirect and DNS-rebinding test scenarios","description":"Extend the integration test fixtures with respx-mocked destinations that redirect to a forbidden IP and with a fake resolver that returns a public IP on first lookup and a private IP on a second, so the pinned-transport and redirect-revalidation logic can be exercised deterministically.","priority":"medium","createdAt":22},"task-p3-23":{"id":"task-p3-23","title":"Integration test: consecutive failures open the breaker, cooldown half-opens it, success closes it","description":"Cover the full closed \u2192 open \u2192 half-open \u2192 closed cycle against a real Postgres-backed endpoint record, matching test #10 from the plan's testing section.","priority":"high","createdAt":23},"task-p3-24":{"id":"task-p3-24","title":"Integration test: redirect to a forbidden IP is blocked with no connection made","description":"Assert that a destination redirecting to `169.254.169.254` (or another denied range) produces an `ssrf_blocked` attempt with zero underlying socket connections to the forbidden address, matching test #11 from the plan's testing section.","priority":"high","createdAt":24},"task-p3-25":{"id":"task-p3-25","title":"Test: DNS-rebinding attempt still resolves to the pinned, validated IP","description":"Assert that when a hostname resolves to a public IP at validation time and a private IP a moment later, the outbound request still connects to the originally validated public IP rather than re-resolving, proving the TOCTOU window is actually closed.","priority":"high","createdAt":25},"task-p3-26":{"id":"task-p3-26","title":"Test: signature verification accepts a valid signature and rejects a tampered or expired one","description":"Cover the signer/verifier pair with hypothesis-generated payloads: a correctly signed request within the tolerance window verifies, a single tampered payload byte fails, and a timestamp outside the tolerance window is rejected even with a correct signature.","priority":"high","createdAt":26},"task-p3-27":{"id":"task-p3-27","title":"Integration test: rate limit returns 429 with Retry-After once a tenant's budget is exhausted","description":"Assert a tenant exceeding its configured event-ingest rate receives `429` with a `Retry-After` header, and that a different tenant's budget is unaffected.","priority":"high","createdAt":27},"task-p3-28":{"id":"task-p3-28","title":"Integration test: DLQ replay starts a fresh chain and preserves original attempt history","description":"Assert replaying a dead delivery creates new delivery attempts going forward while the original (exhausted) attempt rows remain intact and queryable, matching the plan's end-to-end verification walkthrough.","priority":"high","createdAt":28},"task-p3-29":{"id":"task-p3-29","title":"Write ADR: Phase 3 security and resilience decisions","description":"Document the IP-pinned-transport-over-hostname-revalidation choice, the per-endpoint-semaphore-over-fair-scheduling tradeoff, and the breaker threshold/cooldown values chosen, per the plan's Decision/Context/Alternatives/Why/Tradeoff ADR format.","priority":"low","createdAt":29},"task-p3-30":{"id":"task-p3-30","title":"Update docs/failure-modes.md and docs/guarantees.md with Phase 3 rows","description":"Add failure-mode rows for breaker trip/recovery, SSRF-blocked destination, and rate-limit rejection with their proving tests, and update docs/guarantees.md to state the HMAC-signing, SSRF-mitigation (with DNS-rebinding named as a residual risk), and DLQ-replayable guarantees explicitly.","priority":"low","createdAt":30},"task-p3-10":{"id":"task-p3-10","title":"Document and apply VPS egress firewall rules as defense in depth","description":"Add nftables/UFW rules on the VPS denying the Relay containers' outbound traffic to private/link-local ranges regardless of application-layer behavior, and document the rule set in the runbook so the app is not the only thing standing between an attacker and the internal network.\n\nBLOCKED: documented in docs/runbook.md but nftables/UFW rules not applied to the shared VPS -- deferred per docs/PROJECT_STATUS.md","priority":"medium","createdAt":10},"task-p8-01":{"id":"task-p8-01","title":"Audit the twelve failure-scenario tests against the actual suite and close every gap","description":"Map each of the plan's twelve failure scenarios (crash after commit before publish, SKIP LOCKED race, XAUTOCLAIM reclaim, duplicate after unacked HTTP send, idempotent ingest, 409 on differing body, jittered retry on 500, timeout recorded as timeout, ZSET-to-stream promotion, breaker closed->open->half-open->closed, forbidden-redirect block, auth rejection and tenant isolation) to a named, passing test in the repo. Write any that are missing. The list is the plan's stated definition of done, so no scenario may rest on \"probably covered.\"","priority":"high","createdAt":1},"task-p8-05":{"id":"task-p8-05","title":"Build a guarantee-pinned live smoke suite under tests/e2e/ parameterized by base URL","description":"One test per promise in docs/guarantees.md, executed over the public API via a sandbox tenant: provision sandbox, register the `always-200` mock, trigger an event, poll the attempt log until delivered, verify `202` + `Location`, idempotent re-POST yields one event, differing body yields `409`, exhausted retries land in the DLQ and replay works. Parameterized by base URL so the identical suite runs against local compose and `https://api.<domain>`.","priority":"high","createdAt":5},"task-p8-06":{"id":"task-p8-06","title":"Run the live smoke suite from the deploy job after the /readyz gate","description":"Wire the smoke suite into deploy.yml after the health gate, so a deploy is \"done\" only when the guarantees pass against the new container, not merely when it reports ready. A smoke failure is handled like a failed gate: investigate, roll back with `deploy.sh <previous-sha>`.","priority":"medium","createdAt":6},"task-p8-07":{"id":"task-p8-07","title":"Live SSRF probe: forbidden destinations rejected on prod with no connection made","description":"From outside, register destinations for loopback, an RFC1918 address, `169.254.169.254`, a public hostname that resolves to a private IP (the rebinding shape), and the `redirect-to-metadata` mock; assert each attempt records `ssrf_blocked` and the attempt log shows no connection was ever made to the forbidden address.","priority":"high","createdAt":7},"task-p8-09":{"id":"task-p8-09","title":"Live abuse-control checks: quotas, rate limit, TTL, and payload cap on prod","description":"Against the deployed console API: the 4th endpoint and 21st event are rejected, the per-IP sandbox-creation limit returns `429` with `Retry-After`, a 65 KB payload returns `413`, and a sandbox key is rejected after its 60-minute TTL (clock-skipped locally, spot-checked for real in prod).","priority":"medium","createdAt":9},"task-p8-10":{"id":"task-p8-10","title":"Live auth checks: revoked key and cross-tenant isolation on prod","description":"Revoke a sandbox key and assert `401` on the next request; with two live sandboxes, assert tenant A's key cannot read tenant B's endpoints, deliveries, attempt log, or DLQ -- the isolation claim tested through the real deployed auth path, not just the service layer.","priority":"medium","createdAt":10},"task-p8-11":{"id":"task-p8-11","title":"Deploy-gate drill: a failing image aborts the swap; rehearse the rollback one-liner","description":"Deploy an image whose `/readyz` deliberately fails and assert the deploy aborts with the previous container still serving traffic throughout. Then run `deploy.sh <previous-sha>` once for real, time it, and record both drills with dates in docs/runbook.md.","priority":"medium","createdAt":11},"task-p8-12":{"id":"task-p8-12","title":"Verify the nightly backup actually fires on the VPS and restore a real prod dump","description":"Confirm the backup timer is installed and has fired within the last 24 hours (currently the script exists but the timer is not installed on prod -- this ticket closes that gap), then restore the newest dump into a scratch Postgres container and diff row counts against prod. A backup that has never restored a production dump proves nothing.","priority":"high","createdAt":12},"task-p8-13":{"id":"task-p8-13","title":"Verify a live delivery's HMAC signature with an independent, out-of-repo script","description":"Reimplement `timestamp.body` HMAC-SHA256 verification in a standalone script that imports nothing from `src/`, verify a real delivery captured at a receiver against the endpoint secret, then tamper one byte and assert failure -- proving the documented signing contract is sufficient for a real consumer, not merely internally consistent.","priority":"medium","createdAt":13},"task-p8-14":{"id":"task-p8-14","title":"Reconcile docs/failure-modes.md: every Proof cell names a real, passing test","description":"Walk the failure-modes table and require each row's Proof cell to point at a named test that exists and passes; the chaos tests from this phase fill the \"chaos test\" cells that were previously aspirational. Rows with no honest proof either get one written or get their claim reworded.","priority":"low","createdAt":14},"task-p8-02":{"id":"task-p8-02","title":"Chaos test: relay dead between DB commit and Redis publish, event still delivers","description":"Against the real compose stack: stop the relay container, POST an event (expect `202`), verify the outbox row sits `pending` with nothing in the stream, then start the relay and assert the delivery completes. Process-level proof that \"a 202 is never a lie,\" not a testcontainers simulation of it.\n\nBLOCKED: written and reviewed, but never executed: the suite kills real containers and wants a stack somebody is watching, not the box serving the domain","priority":"high","createdAt":2},"task-p8-03":{"id":"task-p8-03","title":"Chaos test: docker kill a dispatcher mid-delivery, XAUTOCLAIM redelivers under the original ID","description":"Point an endpoint at the `slow-8s` mock, `docker kill -s KILL` the dispatcher while the attempt is in flight, and assert the reaper reclaims the message under its original stream ID and the event is ultimately delivered -- with the duplicate visible at the receiver, since that duplicate is the at-least-once claim made concrete.\n\nBLOCKED: written and reviewed, but never executed: the suite kills real containers and wants a stack somebody is watching, not the box serving the domain","priority":"high","createdAt":3},"task-p8-04":{"id":"task-p8-04","title":"Chaos test: restart Postgres and Redis under in-flight traffic with zero accepted-event loss","description":"While a steady trickle of events flows, `docker restart` Postgres, then Redis, then reconcile: every event that received a `202` must reach a terminal delivery state (delivered or dead) after recovery, and none may vanish. Duplicates are acceptable; loss is the failure condition.\n\nBLOCKED: written and reviewed, but never executed: the suite kills real containers and wants a stack somebody is watching, not the box serving the domain","priority":"medium","createdAt":4},"task-p8-08":{"id":"task-p8-08","title":"Verify the VPS egress firewall blocks private ranges independently of the app","description":"`docker exec` into the dispatcher container and attempt raw TCP connections to RFC1918, link-local, and metadata addresses, asserting the network layer refuses them even with application validation out of the picture. The defense-in-depth claim is only a claim until this has been observed on the real VPS; record the nftables/UFW rule set alongside the result.\n\nBLOCKED: verification built and executed 2026-08-24 -- result: NOT blocked at the network layer. Applying the (now corrected) rules needs coordination on this shared VPS","priority":"high","createdAt":8}},"backlog":[]}
</script>

<header>
  <div>
    <h1>Kanban</h1>
    <div class="sub" id="sync-status">Saved automatically in this browser</div>
  </div>
  <div class="header-actions">
    <button class="btn" id="export-btn">Export</button>
    <button class="btn" id="import-btn">Import</button>
    <input type="file" id="import-input" accept="application/json">
  </div>
</header>

<div class="app-body">
  <nav class="sidebar">
    <button class="nav-item" data-view="board"><span class="nav-icon">&#128203;</span> Board</button>
    <button class="nav-item" data-view="backlog"><span class="nav-icon">&#128194;</span> Backlog <span class="nav-badge" id="backlog-count">0</span></button>
  </nav>
  <div class="content">
    <div id="board-view"></div>
    <div id="backlog-view" class="hidden"></div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = "kanban-board-v1";

  const defaultState = () => ({
    rev: 0,
    columns: ["col-todo", "col-doing", "col-done"],
    columnData: {
      "col-todo": { title: "To Do", taskIds: [] },
      "col-doing": { title: "In Progress", taskIds: [] },
      "col-done": { title: "Done", taskIds: [] }
    },
    tasks: {},
    backlog: []
  });

  function readSeedState() {
    try {
      const el = document.getElementById("board-seed");
      if (!el) return null;
      const parsed = JSON.parse(el.textContent);
      if (!parsed.columns || !parsed.columnData || !parsed.tasks) return null;
      if (!Array.isArray(parsed.backlog)) parsed.backlog = [];
      if (typeof parsed.rev !== "number") parsed.rev = 0;
      return parsed;
    } catch (e) {
      return null;
    }
  }

  // The seed block above is regenerated by kanban-board/board_cli.py every time
  // ticket status changes. Its `rev` always wins over localStorage so a plain
  // page refresh always reflects the latest real status, even in a browser tab
  // that already had older board state saved locally.
  function loadState() {
    const seed = readSeedState();
    let stored = null;
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.columns && parsed.columnData && parsed.tasks) {
          if (!Array.isArray(parsed.backlog)) parsed.backlog = [];
          if (typeof parsed.rev !== "number") parsed.rev = 0;
          stored = parsed;
        }
      }
    } catch (e) {
      stored = null;
    }

    if (seed && (!stored || seed.rev > stored.rev)) return seed;
    if (stored) return stored;
    if (seed) return seed;
    return defaultState();
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = loadState();
  let currentView = "board";
  let idCounter = Date.now();
  function uid(prefix) {
    idCounter += 1;
    return prefix + "-" + idCounter.toString(36);
  }

  const boardView = document.getElementById("board-view");
  const backlogView = document.getElementById("backlog-view");

  function renderApp() {
    document.querySelectorAll(".nav-item").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.view === currentView);
    });
    document.getElementById("backlog-count").textContent = state.backlog.length;
    boardView.classList.toggle("hidden", currentView !== "board");
    backlogView.classList.toggle("hidden", currentView !== "backlog");

    const statusEl = document.getElementById("sync-status");
    const doingCol = state.columnData["col-doing"];
    const inProgress = doingCol ? doingCol.taskIds.map(id => state.tasks[id]).filter(Boolean) : [];
    if (inProgress.length) {
      statusEl.textContent = "Live · rev " + (state.rev || 0) + " · in progress: " + inProgress.map(t => t.title).join(", ");
    } else {
      statusEl.textContent = "Live · rev " + (state.rev || 0) + " · nothing in progress";
    }

    if (currentView === "board") renderBoard();
    else renderBacklog();
  }

  document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
      currentView = btn.dataset.view;
      renderApp();
    });
  });

  // ---------- Board ----------

  function renderBoard() {
    boardView.innerHTML = "";
    state.columns.forEach(colId => {
      boardView.appendChild(renderColumn(colId));
    });
    boardView.appendChild(renderNewColumnButton());
  }

  function renderColumn(colId) {
    const col = state.columnData[colId];
    const el = document.createElement("div");
    el.className = "column";
    el.dataset.colId = colId;

    const header = document.createElement("div");
    header.className = "column-header";

    const titleWrap = document.createElement("div");
    titleWrap.style.display = "flex";
    titleWrap.style.alignItems = "center";
    titleWrap.style.flex = "1";
    titleWrap.style.minWidth = "0";

    const titleInput = document.createElement("input");
    titleInput.className = "column-title";
    titleInput.value = col.title;
    titleInput.addEventListener("change", () => {
      col.title = titleInput.value.trim() || col.title;
      saveState();
    });
    titleInput.addEventListener("keydown", e => {
      if (e.key === "Enter") titleInput.blur();
    });

    const count = document.createElement("span");
    count.className = "count";
    count.textContent = col.taskIds.length;

    titleWrap.appendChild(titleInput);
    titleWrap.appendChild(count);

    const delBtn = document.createElement("button");
    delBtn.className = "col-delete";
    delBtn.textContent = "×";
    delBtn.title = "Delete column";
    delBtn.addEventListener("click", () => {
      if (col.taskIds.length && !confirm(`Delete "${col.title}" and its ${col.taskIds.length} task(s)?`)) return;
      col.taskIds.forEach(tid => delete state.tasks[tid]);
      state.columns = state.columns.filter(id => id !== colId);
      delete state.columnData[colId];
      saveState();
      renderApp();
    });

    header.appendChild(titleWrap);
    header.appendChild(delBtn);

    const list = document.createElement("div");
    list.className = "task-list";
    list.dataset.colId = colId;

    col.taskIds.forEach(taskId => {
      list.appendChild(renderCard(taskId, colId));
    });

    setupDropZone(list, colId);

    const addBtn = document.createElement("button");
    addBtn.className = "add-task-btn";
    addBtn.textContent = "+ Add a task";
    addBtn.addEventListener("click", () => showAddTaskForm(el, list, colId, addBtn));

    el.appendChild(header);
    el.appendChild(list);
    el.appendChild(addBtn);
    return el;
  }

  function showAddTaskForm(columnEl, list, colId, addBtn) {
    addBtn.style.display = "none";
    const form = buildTaskForm({
      onSave: (data) => {
        const taskId = uid("task");
        state.tasks[taskId] = { id: taskId, createdAt: Date.now(), ...data };
        state.columnData[colId].taskIds.push(taskId);
        saveState();
        renderApp();
      },
      onCancel: () => {
        form.remove();
        addBtn.style.display = "block";
      },
      saveLabel: "Add"
    });
    columnEl.insertBefore(form, addBtn);
    form.querySelector(".f-title").focus();
  }

  function renderCard(taskId, colId) {
    const task = state.tasks[taskId];
    const card = document.createElement("div");
    card.className = "card" + (task.priority ? " priority-" + task.priority : "");
    card.draggable = true;
    card.dataset.taskId = taskId;

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = task.title;
    card.appendChild(title);

    if (task.description) {
      const desc = document.createElement("div");
      desc.className = "card-desc";
      desc.textContent = task.description;
      card.appendChild(desc);
    }

    const removeBtn = document.createElement("button");
    removeBtn.className = "card-remove";
    removeBtn.textContent = "×";
    removeBtn.title = "Delete task";
    removeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      state.columnData[colId].taskIds = state.columnData[colId].taskIds.filter(id => id !== taskId);
      delete state.tasks[taskId];
      saveState();
      renderApp();
    });
    card.appendChild(removeBtn);

    card.addEventListener("click", (e) => {
      if (e.target === removeBtn) return;
      editCard(card, taskId, colId);
    });

    card.addEventListener("dragstart", () => {
      card.classList.add("dragging");
      dragged = { taskId, fromCol: colId };
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      dragged = null;
      renderApp();
    });

    return card;
  }

  function editCard(card, taskId, colId) {
    const task = state.tasks[taskId];
    card.innerHTML = "";
    card.style.cursor = "default";
    card.draggable = false;
    const form = buildTaskForm({
      initial: task,
      onSave: (data) => {
        Object.assign(task, data);
        saveState();
        renderApp();
      },
      onCancel: () => renderApp(),
      saveLabel: "Save"
    });
    form.style.margin = "0";
    form.style.boxShadow = "none";
    form.style.padding = "0";
    card.appendChild(form);
  }

  let dragged = null;

  function setupDropZone(list, colId) {
    list.addEventListener("dragover", (e) => {
      e.preventDefault();
      const afterEl = getDragAfterElement(list, e.clientY);
      clearPlaceholders();
      const placeholder = document.createElement("div");
      placeholder.className = "drop-placeholder";
      if (afterEl) list.insertBefore(placeholder, afterEl);
      else list.appendChild(placeholder);
    });

    list.addEventListener("dragleave", (e) => {
      if (!list.contains(e.relatedTarget)) clearPlaceholders();
    });

    list.addEventListener("drop", (e) => {
      e.preventDefault();
      if (!dragged) return;
      const { taskId, fromCol } = dragged;
      const afterEl = getDragAfterElement(list, e.clientY);
      const toCol = colId;

      state.columnData[fromCol].taskIds = state.columnData[fromCol].taskIds.filter(id => id !== taskId);

      const targetIds = state.columnData[toCol].taskIds;
      if (afterEl) {
        const afterId = afterEl.dataset.taskId;
        const idx = targetIds.indexOf(afterId);
        targetIds.splice(idx, 0, taskId);
      } else {
        targetIds.push(taskId);
      }

      clearPlaceholders();
      saveState();
      renderApp();
    });
  }

  function clearPlaceholders() {
    document.querySelectorAll(".drop-placeholder").forEach(p => p.remove());
  }

  function getDragAfterElement(list, y) {
    const cards = [...list.querySelectorAll(".card:not(.dragging)")];
    let closest = { offset: -Infinity, element: null };
    for (const child of cards) {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        closest = { offset, element: child };
      }
    }
    return closest.element;
  }

  function renderNewColumnButton() {
    const wrap = document.createElement("div");
    wrap.className = "new-column";
    const btn = document.createElement("button");
    btn.className = "new-column-btn";
    btn.textContent = "+ Add column";
    btn.addEventListener("click", () => {
      const title = prompt("Column name:");
      if (!title || !title.trim()) return;
      const colId = uid("col");
      state.columns.push(colId);
      state.columnData[colId] = { title: title.trim(), taskIds: [] };
      saveState();
      renderApp();
    });
    wrap.appendChild(btn);
    return wrap;
  }

  // ---------- Shared task/backlog form builder ----------

  function buildTaskForm({ initial, onSave, onCancel, saveLabel }) {
    const form = document.createElement("div");
    form.className = "add-form";
    form.innerHTML = `
      <input type="text" placeholder="Title" class="f-title">
      <textarea placeholder="Description (optional)" rows="2" class="f-desc"></textarea>
      <div class="row">
        <select class="f-priority">
          <option value="">No priority</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary f-save">${saveLabel}</button>
        <button class="btn f-cancel">Cancel</button>
      </div>
    `;
    const titleField = form.querySelector(".f-title");
    const descField = form.querySelector(".f-desc");
    const priorityField = form.querySelector(".f-priority");

    if (initial) {
      titleField.value = initial.title || "";
      descField.value = initial.description || "";
      priorityField.value = initial.priority || "";
    }

    function save() {
      const title = titleField.value.trim();
      if (!title) { onCancel(); return; }
      onSave({
        title,
        description: descField.value.trim(),
        priority: priorityField.value
      });
    }

    form.querySelector(".f-save").addEventListener("click", (e) => { e.stopPropagation(); save(); });
    form.querySelector(".f-cancel").addEventListener("click", (e) => { e.stopPropagation(); onCancel(); });
    form.addEventListener("click", (e) => e.stopPropagation());
    titleField.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); save(); }
      if (e.key === "Escape") onCancel();
    });

    return form;
  }

  // ---------- Backlog ----------

  function renderBacklog() {
    backlogView.innerHTML = "";

    const header = document.createElement("div");
    header.className = "backlog-header";
    header.innerHTML = `<h2>Backlog</h2><div class="sub">Ordered by priority — drag to reorder. Push items to the board when you're ready to work on them.</div>`;
    backlogView.appendChild(header);

    const addBtn = document.createElement("button");
    addBtn.className = "add-task-btn";
    addBtn.id = "backlog-add-btn";
    addBtn.textContent = "+ Add to backlog";
    addBtn.addEventListener("click", () => showAddBacklogForm(addBtn));
    backlogView.appendChild(addBtn);

    const list = document.createElement("div");
    list.className = "backlog-list";
    list.id = "backlog-list";

    if (state.backlog.length === 0) {
      const empty = document.createElement("div");
      empty.className = "backlog-empty";
      empty.textContent = "Nothing here yet. Brain-dump ideas above — you don't need to fully define them until you're ready to work on them.";
      list.appendChild(empty);
    } else {
      state.backlog.forEach(item => list.appendChild(renderBacklogCard(item)));
    }

    setupBacklogDropZone(list);
    backlogView.appendChild(list);
  }

  function showAddBacklogForm(addBtn) {
    addBtn.style.display = "none";
    const form = buildTaskForm({
      onSave: (data) => {
        const id = uid("backlog");
        state.backlog.push({ id, createdAt: Date.now(), ...data });
        saveState();
        renderApp();
      },
      onCancel: () => {
        form.remove();
        addBtn.style.display = "block";
      },
      saveLabel: "Add"
    });
    backlogView.insertBefore(form, addBtn.nextSibling);
    form.querySelector(".f-title").focus();
  }

  function renderBacklogCard(item) {
    const card = document.createElement("div");
    card.className = "card backlog-card" + (item.priority ? " priority-" + item.priority : "");
    card.draggable = true;
    card.dataset.backlogId = item.id;

    const title = document.createElement("div");
    title.className = "card-title";
    title.textContent = item.title;
    card.appendChild(title);

    if (item.description) {
      const desc = document.createElement("div");
      desc.className = "card-desc";
      desc.textContent = item.description;
      card.appendChild(desc);
    }

    const removeBtn = document.createElement("button");
    removeBtn.className = "card-remove";
    removeBtn.textContent = "×";
    removeBtn.title = "Delete";
    removeBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      state.backlog = state.backlog.filter(b => b.id !== item.id);
      saveState();
      renderApp();
    });
    card.appendChild(removeBtn);

    const actions = document.createElement("div");
    actions.className = "backlog-actions";
    const toTodoBtn = document.createElement("button");
    toTodoBtn.className = "to-todo-btn";
    toTodoBtn.textContent = "Add to " + (state.columnData[state.columns[0]] ? state.columnData[state.columns[0]].title : "board") + " →";
    toTodoBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      moveBacklogItemToBoard(item.id);
    });
    actions.appendChild(toTodoBtn);
    card.appendChild(actions);

    card.addEventListener("click", (e) => {
      if (e.target === removeBtn || e.target === toTodoBtn) return;
      editBacklogCard(card, item);
    });

    card.addEventListener("dragstart", () => {
      card.classList.add("dragging");
      draggedBacklogId = item.id;
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      draggedBacklogId = null;
      renderApp();
    });

    return card;
  }

  function editBacklogCard(card, item) {
    card.innerHTML = "";
    card.style.cursor = "default";
    card.draggable = false;
    const form = buildTaskForm({
      initial: item,
      onSave: (data) => {
        Object.assign(item, data);
        saveState();
        renderApp();
      },
      onCancel: () => renderApp(),
      saveLabel: "Save"
    });
    form.style.margin = "0";
    form.style.boxShadow = "none";
    form.style.padding = "0";
    card.appendChild(form);
  }

  function moveBacklogItemToBoard(backlogId, colId) {
    const idx = state.backlog.findIndex(b => b.id === backlogId);
    if (idx === -1) return;
    const item = state.backlog[idx];
    const targetCol = colId || state.columns[0];
    if (!targetCol) { alert("Add a column to the board first."); return; }

    const taskId = uid("task");
    state.tasks[taskId] = {
      id: taskId,
      title: item.title,
      description: item.description,
      priority: item.priority,
      createdAt: Date.now()
    };
    state.columnData[targetCol].taskIds.push(taskId);
    state.backlog.splice(idx, 1);
    saveState();
    renderApp();
  }

  let draggedBacklogId = null;

  function setupBacklogDropZone(list) {
    list.addEventListener("dragover", (e) => {
      e.preventDefault();
      const afterEl = getDragAfterElementGeneric(list, e.clientY, ".backlog-card:not(.dragging)");
      clearPlaceholders();
      const placeholder = document.createElement("div");
      placeholder.className = "drop-placeholder";
      if (afterEl) list.insertBefore(placeholder, afterEl);
      else list.appendChild(placeholder);
    });

    list.addEventListener("dragleave", (e) => {
      if (!list.contains(e.relatedTarget)) clearPlaceholders();
    });

    list.addEventListener("drop", (e) => {
      e.preventDefault();
      clearPlaceholders();
      if (!draggedBacklogId) return;
      const afterEl = getDragAfterElementGeneric(list, e.clientY, ".backlog-card:not(.dragging)");
      const fromIdx = state.backlog.findIndex(b => b.id === draggedBacklogId);
      if (fromIdx === -1) return;
      const [item] = state.backlog.splice(fromIdx, 1);

      if (afterEl) {
        const afterId = afterEl.dataset.backlogId;
        const idx = state.backlog.findIndex(b => b.id === afterId);
        state.backlog.splice(idx, 0, item);
      } else {
        state.backlog.push(item);
      }

      saveState();
      renderApp();
    });
  }

  function getDragAfterElementGeneric(list, y, selector) {
    const els = [...list.querySelectorAll(selector)];
    let closest = { offset: -Infinity, element: null };
    for (const child of els) {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        closest = { offset, element: child };
      }
    }
    return closest.element;
  }

  // ---------- Export / Import ----------

  document.getElementById("export-btn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "kanban-backup.json";
    a.click();
    URL.revokeObjectURL(url);
  });

  const importInput = document.getElementById("import-input");
  document.getElementById("import-btn").addEventListener("click", () => importInput.click());
  importInput.addEventListener("change", () => {
    const file = importInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.columns || !parsed.columnData || !parsed.tasks) {
          alert("Invalid backup file.");
          return;
        }
        if (!Array.isArray(parsed.backlog)) parsed.backlog = [];
        state = parsed;
        saveState();
        renderApp();
      } catch (e) {
        alert("Could not read that file.");
      }
    };
    reader.readAsText(file);
    importInput.value = "";
  });

  renderApp();
})();
</script>

</body>
</html>
