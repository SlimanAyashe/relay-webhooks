name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  UV_LOCKED: "1"

jobs:
  lint-typecheck:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  import-linter:
    name: import-linter architecture contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run lint-imports

  pip-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pip-audit

  test:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
        env:
          # tests/integration provisions its own Postgres/Redis via
          # testcontainers, so this job only needs Docker (pre-installed
          # on the ubuntu-latest runner), not service: containers.
          TESTCONTAINERS_RYUK_DISABLED: "true"

  openapi-drift:
    name: OpenAPI spec drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/generate_openapi_spec.py --check

  migration-round-trip:
    name: alembic upgrade / downgrade round-trip
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://relay:relay@localhost:5432/relay
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade -1
      - run: uv run alembic upgrade head

  docker-build:
    name: validate Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false

  build-and-push:
    name: build + push image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-typecheck, import-linter, pip-audit, test, openapi-drift, migration-round-trip, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR requires a lowercase repository path; github.repository preserves
      # whatever case the GitHub org/repo names actually use, so it can't be
      # interpolated into the tag directly (Actions expressions have no
      # toLower()) — normalize it once here instead.
      - name: Set lowercase image repository
        run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}:latest
