name: relay

# Production overlay: api runs the pre-built GHCR image (set via $RELAY_IMAGE
# by scripts/deploy_remote.sh). TLS termination and routing are handled by
# the host's shared Traefik instance (see docs/adr/0002-shared-vps-traefik.md)
# via labels below, not by a Relay-owned proxy — this VPS also runs other
# production services (bookr.tech, n8n) whose Traefik already owns 80/443.
# Bring up with: RELAY_IMAGE=ghcr.io/<owner>/<repo>:<sha> docker compose -f
# docker/compose.prod.yml up -d
#
# Expects a .env file one directory up (../.env relative to this file, i.e.
# /opt/relay/.env on the VPS — never committed) providing POSTGRES_PASSWORD.

x-logging: &default-logging
  # json-file has no size cap by default -- stdout is the only place structlog's
  # JSON lines go (see docs/adr/0007-phase-5-observability-and-ops.md), so without
  # this every container's log would grow unbounded on disk. Rotates at 10MB x 5
  # files per container (50MB cap), which is Docker-level and needs no host cron/
  # logrotate setup -- see docs/runbook.md.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  api:
    image: ${RELAY_IMAGE:?RELAY_IMAGE must be set to a ghcr.io image ref}
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000" # loopback-only, for deploy_remote.sh's own /readyz poll
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.relay.rule: Host(`relay.bookr.tech`) || Host(`api.relay.bookr.tech`)
      traefik.http.routers.relay.entrypoints: websecure
      traefik.http.routers.relay.tls.certresolver: letsencrypt
      traefik.http.services.relay.loadbalancer.server.port: "8000"
    logging: *default-logging

  relay-worker:
    image: ${RELAY_IMAGE:?RELAY_IMAGE must be set to a ghcr.io image ref}
    command: ["python", "-m", "relay.workers.relay"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # The image's baked-in HEALTHCHECK curls /healthz, which only the api service serves --
    # workers don't listen on any port, so disable it rather than have Docker report them
    # perpetually unhealthy.
    healthcheck:
      disable: true
    logging: *default-logging

  dispatcher:
    image: ${RELAY_IMAGE:?RELAY_IMAGE must be set to a ghcr.io image ref}
    command: ["python", "-m", "relay.workers.dispatcher"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging: *default-logging

  scheduler:
    image: ${RELAY_IMAGE:?RELAY_IMAGE must be set to a ghcr.io image ref}
    command: ["python", "-m", "relay.workers.scheduler"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging: *default-logging

  reaper:
    image: ${RELAY_IMAGE:?RELAY_IMAGE must be set to a ghcr.io image ref}
    command: ["python", "-m", "relay.workers.reaper"]
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://relay:${POSTGRES_PASSWORD}@postgres:5432/relay
      REDIS_URL: redis://redis:6379/0
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true
    logging: *default-logging

volumes:
  pgdata:
